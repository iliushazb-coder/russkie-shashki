# Конфигурация Cloudflare Worker russkie-shashki-auth.
#
# Здесь ТОЛЬКО несекретные значения. Два секрета —
# FIREBASE_SERVICE_ACCOUNT_PRIVATE_KEY и TELEGRAM_BOT_TOKEN — хранятся
# в Cloudflare Secrets и в репозиторий не попадают никогда.
# Локально они задаются через .dev.vars; этот файл покрыт .gitignore.
#
# Актуальное production-состояние после deploy 2026-09-11 зафиксировано в
# worker/PRODUCTION.md. Активная production Version ID:
# db07d6a5-4067-4ac2-a2e7-d4b827e93218.
# Фактический production compatibility_date подтверждён как 2026-08-30.
#
# compatibility_date НАМЕРЕННО НЕ добавлен в этот файл в рамках документационной
# актуализации пункта №1, чтобы не менять deploy-конфигурацию без отдельного
# согласования. Последний production deploy выполнялся с явным CLI-параметром
# --compatibility-date 2026-08-30 после успешного dry-run с тем же значением.
# При любом будущем deploy использовать только подтверждённое production-
# значение и не подставлять предположения.

name = "russkie-shashki-auth"
main = "index.mjs"

[vars]
ALLOWED_ORIGINS = "https://iliushazb-coder.github.io"
FIREBASE_APP_ID = "1:225166276271:web:f15906ebc83350b002c65a"
FIREBASE_DB_URL = "https://russkie-shashki-online-default-rtdb.europe-west1.firebasedatabase.app"
FIREBASE_SERVICE_ACCOUNT_EMAIL = "firebase-adminsdk-fbsvc@russkie-shashki-online.iam.gserviceaccount.com"
FIREBASE_WEB_API_KEY = "AIzaSyBZzxmmgRxNe1b-MFG4zIlCFTI7D3lStiA"
TELEGRAM_AUTH_MAX_AGE_SECONDS = "3600"

# Секреты (только имена, значений здесь быть не должно):
#   FIREBASE_SERVICE_ACCOUNT_PRIVATE_KEY
#   TELEGRAM_BOT_TOKEN
