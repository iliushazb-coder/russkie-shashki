name: invite-ux exact builder

on:
  push:
    branches:
      - helper/invite-ux-exact-builder

permissions:
  contents: write

jobs:
  build-exact-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and verify exact patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .n21/invite-ux-exact.det.b64.part0 \
            .n21/invite-ux-exact.det.b64.part1 \
            .n21/invite-ux-exact.det.b64.part2 \
            .n21/invite-ux-exact.det.b64.part3 \
            .n21/invite-ux-exact.det.b64.part4 \
            | base64 -d | gzip -d > /tmp/invite-ux-exact.patch
          echo "b950c811d24af03d526710b4d982ba90281a90b495cac0e6c8f3c7089b435f11  /tmp/invite-ux-exact.patch" | sha256sum -c -

      - name: Reproduce exact candidate commit
        shell: bash
        env:
          GIT_COMMITTER_NAME: "candidate-review"
          GIT_COMMITTER_EMAIL: "candidate-review@local"
          GIT_COMMITTER_DATE: "2026-09-06T12:47:56+00:00"
        run: |
          set -euo pipefail
          git checkout --detach ef661a01ded2f866b295db66db735a873fcfbc7f
          git am /tmp/invite-ux-exact.patch
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse HEAD^{tree})"
          echo "PARENT=$(git rev-parse HEAD^)"
          test "$(git rev-parse HEAD)" = "c4baa3b0fab5ff69a45c48b4db3b87be927e0ca9"
          test "$(git rev-parse HEAD^{tree})" = "647dc6beda60478294b32e71b4883a4c194e2d7a"
          test "$(git rev-parse HEAD^)" = "ef661a01ded2f866b295db66db735a873fcfbc7f"

      - name: Push isolated candidate only
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/candidate/invite-ux-startup-cover
