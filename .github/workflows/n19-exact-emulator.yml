name: n19 exact emulator verification

on:
  push:
    branches:
      - verify/n19-emulator
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-n19:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Reconstruct and authenticate exact candidate patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib

          files = sorted(Path("ci/n19").glob("part*.b64"))
          assert len(files) == 8, files
          out = bytearray()
          for f in files:
              encoded = f.read_bytes()
              decoded = base64.b64decode(encoded, validate=True)
              print(f"{f}: b64={len(encoded)} decoded={len(decoded)}")
              out.extend(decoded)

          patch = bytes(out)
          size = len(patch)
          digest = hashlib.sha256(patch).hexdigest()
          Path("/tmp/n19.patch").write_bytes(patch)
          print(f"Exact patch reconstructed: size={size} sha256={digest}")
          assert size == 37309, size
          assert digest == "52a89660da68f55be3618e4c15c64ce0fa994084bb7cee0c8319ac7d806564fd", digest
          PY

      - name: Checkout exact №18 base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          current_main="$(git rev-parse origin/main)"
          expected_base="e86040f7ae532dda6d979d0189b1951630db79b9"
          echo "origin/main=$current_main"
          test "$current_main" = "$expected_base"
          git checkout --detach "$expected_base"
          test "$(git rev-parse HEAD)" = "$expected_base"

      - name: Apply exact №19 patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/n19.patch
          git apply /tmp/n19.patch
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' 'firebase/database.rules.json' 'tests/firebase-rules/database.rules.test.mjs' | sort)"
          test "$actual" = "$expected"
          echo "Changed files after patch:"
          printf '%s\n' "$actual"

      - name: Install dependencies
        run: npm ci

      - name: Frontend syntax
        run: npm run check

      - name: Frontend tests
        run: npm test

      - name: Worker syntax
        run: node --check worker/index.mjs

      - name: Worker unit tests
        run: node --test tests/worker/worker-unit.test.mjs

      - name: Settlement behavior tests
        run: node tests/settlement-behavior.test.js

      - name: Firebase Rules Emulator tests
        run: npm run test:rules

      - name: Publish exact №19 to main
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' 'firebase/database.rules.json' 'tests/firebase-rules/database.rules.test.mjs' | sort)"
          test "$actual" = "$expected"
          git diff --check

          git config user.name "iliushazb-coder"
          git config user.email "iliushazb@gmail.com"
          git add firebase/database.rules.json tests/firebase-rules/database.rules.test.mjs

          staged="$(git diff --cached --name-only | sort)"
          test "$staged" = "$expected"

          git commit -m "security: protect room presence ownership (№19)" -m "Publishes exact candidate 17c5338d after independent review and Firebase Rules Emulator 165/165."
          echo "publish_commit=$(git rev-parse HEAD)"
          echo "publish_tree=$(git rev-parse HEAD^{tree})"
          git push origin HEAD:main
