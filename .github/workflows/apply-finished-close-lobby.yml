name: apply-finished-close-lobby

on:
  push:
    branches:
      - fix/finished-close-lobby

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact reviewed patch and tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          script = Path('script.js')
          data = script.read_bytes()
          expected_before = '27B54C078D1E74E6A1A5C50E55F4D69CBA088D6E8859B4F1724607206D71D964'
          actual_before = hashlib.sha256(data).hexdigest().upper()
          if actual_before != expected_before:
              raise SystemExit(f'STOP: unexpected production script SHA256={actual_before}')

          s = data.decode('utf-8')
          start = s.index('btnCloseGame.addEventListener("click", function () {')
          end = s.index('\n\n    closeModal(endGameModal);\n    markMyselfLeftExplicitly();', start)

          new = '''// Завершивший online-игрок остаётся внутри Mini App: отписываемся от старой
          // комнаты, инвалидируем локальное поколение и возвращаемся в online-лобби.
          // Helper идемпотентен относительно cleanupFinishedRoom(): safe-cleanup уже
          // мог снять presence/сбросить roomCode, повторное локальное снятие безопасно.
          function leaveFinishedOnlineAndReturnToLobby() {
              detachRoomListener();
              detachMyPresence();
              isOnlineGame = false;
              roomCode = null;
              currentState = null;
              showGroupLobby();
          }

          btnCloseGame.addEventListener("click", function () {
              // Если мы зритель — просто отписываемся от комнаты и выходим в меню.
              if (isSpectator) {
                  closeModal(endGameModal);
                  detachRoomListener();
                  if (myCurrentSpectatorRef) { if (canUseFirebase()) myCurrentSpectatorRef.remove(); myCurrentSpectatorRef = null; }
                  showScreen(menuScreen);
                  loadActiveRooms();
                  return;
              }

              // ONLINE finished-room нельзя удалять, пока Worker ещё читает outcome.
              // Это та же гонка, что у быстрого реванша: cleanupFinishedRoom() стирает
              // единственный авторитетный результат партии.
              if (isOnlineGame && currentState && currentState.winner && roomCode) {
                  const codeAtClick = roomCode;
                  const generationAtClick = ratedGenerationKey(roomCode, currentState.matchNumber, currentState.createdAt);

                  waitForSettlementBeforeRoomMutation().then(function (outcome) {
                      closeModal(endGameModal);

                      // После settlement-barrier старый listener больше не нужен.
                      // Снимаем его ДО любых локальных Firebase-записей и ДО возможного
                      // remove комнаты, чтобы старый snapshot не переоткрыл end-game modal.
                      detachRoomListener();
                      markMyselfLeftExplicitly();

                      const stillSameFinished = outcome === "safe"
                          && roomCode === codeAtClick
                          && currentState
                          && ratedGenerationKey(roomCode, currentState.matchNumber, currentState.createdAt) === generationAtClick
                          && !!currentState.winner;

                      if (stillSameFinished) {
                          cleanupFinishedRoom();
                          leaveFinishedOnlineAndReturnToLobby();
                      } else {
                          // changed/blocked: локально закрыться можно, но НЕЛЬЗЯ стирать
                          // новую партию или finished outcome, который сервер не закрепил.
                          detachMyPresence();
                          isOnlineGame = false;
                          roomCode = null;
                          leaveFinishedOnlineAndReturnToLobby();
                      }
                  }).catch(function (error) {
                      console.error("Close after settlement failed:", error);
                      closeModal(endGameModal);
                      detachRoomListener();
                      markMyselfLeftExplicitly();
                      leaveFinishedOnlineAndReturnToLobby();
                  });
                  return;
              }'''

          s = s[:start] + new + s[end:]
          script.write_bytes(s.encode('utf-8'))

          expected_after = '56F940DE6A735F7C6ADD33F77B88DFD6820972F0012857D266272CA50D518D11'
          actual_after = hashlib.sha256(script.read_bytes()).hexdigest().upper()
          if actual_after != expected_after:
              raise SystemExit(f'STOP: candidate SHA mismatch: {actual_after}')

          tests = {
          'tests/finished-close-lobby.test.js': '''const fs = require("fs");

          const src = fs.readFileSync("script.js", "utf8");
          let passed = 0;
          let failed = 0;

          function ok(cond, name) {
              if (cond) {
                  passed++;
                  console.log("✅ " + name);
              } else {
                  failed++;
                  console.log("❌ " + name);
              }
          }

          const marker = "// ===== НОВАЯ ИГРА / ЗАКРЫТЬ =====";
          const markerPos = src.indexOf(marker);
          const cleanupPos = src.indexOf("function cleanupFinishedRoom()", markerPos);
          const section = markerPos >= 0 && cleanupPos > markerPos ? src.slice(markerPos, cleanupPos) : "";

          ok(markerPos >= 0 && cleanupPos > markerPos, "1. найден блок «НОВАЯ ИГРА / ЗАКРЫТЬ»");

          const helperName = "leaveFinishedOnlineAndReturnToLobby";
          const helperStart = section.indexOf("function " + helperName + "()");
          const handlerStart = section.indexOf('btnCloseGame.addEventListener("click"');
          const helperBody = helperStart >= 0 && handlerStart > helperStart ? section.slice(helperStart, handlerStart) : "";

          ok(helperStart >= 0, "2. есть отдельный helper выхода завершившего игрока в лобби");
          ok(helperBody.includes("detachRoomListener();"), "3. helper отписывает старый room-listener");
          ok(helperBody.includes("detachMyPresence();"), "4. helper снимает локальный presence");
          ok(helperBody.includes("isOnlineGame = false;"), "5. helper сбрасывает online-флаг");
          ok(helperBody.includes("roomCode = null;"), "6. helper инвалидирует roomCode");
          ok(helperBody.includes("currentState = null;"), "7. helper очищает старое состояние партии");
          ok(helperBody.includes("showGroupLobby();"), "8. helper возвращает именно в online-лобби");

          const onlineAnchor = "if (isOnlineGame && currentState && currentState.winner && roomCode) {";
          const onlineStart = section.indexOf(onlineAnchor, handlerStart);
          const fallbackAnchor = "\\n    closeModal(endGameModal);\\n    markMyselfLeftExplicitly();";
          const onlineEnd = section.indexOf(fallbackAnchor, onlineStart);
          const onlineBlock = onlineStart >= 0 && onlineEnd > onlineStart ? section.slice(onlineStart, onlineEnd) : "";

          ok(onlineStart >= 0 && onlineEnd > onlineStart, "9. найден finished-online путь кнопки «Закрыть»");
          ok(onlineBlock.includes("waitForSettlementBeforeRoomMutation()"), "10. settlement-барьер перед cleanup сохранён");
          ok(onlineBlock.includes("cleanupFinishedRoom();"), "11. безопасный cleanup завершённой комнаты сохранён");
          ok(!onlineBlock.includes("Telegram.WebApp.close()"), "12. finished-online «Закрыть» больше НЕ закрывает Telegram Mini App");

          const helperCalls = (onlineBlock.match(/leaveFinishedOnlineAndReturnToLobby\\(\\);/g) || []).length;
          ok(helperCalls >= 2, "13. возврат в лобби выполняется и после normal outcome, и при settlement error");

          console.log("\\nИТОГ: " + passed + "/13, провалено: " + failed);
          process.exit(failed ? 1 : 0);
          ''',
          'tests/finished-close-settlement-error.test.js': '''const fs = require("fs");

          const src = fs.readFileSync("script.js", "utf8");
          let passed = 0;
          let failed = 0;

          function ok(cond, name) {
              if (cond) {
                  passed++;
                  console.log("✅ " + name);
              } else {
                  failed++;
                  console.log("❌ " + name);
              }
          }

          const marker = "// ===== НОВАЯ ИГРА / ЗАКРЫТЬ =====";
          const markerPos = src.indexOf(marker);
          const cleanupPos = src.indexOf("function cleanupFinishedRoom()", markerPos);
          const section = markerPos >= 0 && cleanupPos > markerPos
              ? src.slice(markerPos, cleanupPos)
              : "";

          const onlineAnchor = "if (isOnlineGame && currentState && currentState.winner && roomCode) {";
          const onlineStart = section.indexOf(onlineAnchor);
          const fallbackAnchor = "\\n    closeModal(endGameModal);\\n    markMyselfLeftExplicitly();";
          const onlineEnd = section.indexOf(fallbackAnchor, onlineStart);
          const onlineBlock = onlineStart >= 0 && onlineEnd > onlineStart
              ? section.slice(onlineStart, onlineEnd)
              : "";

          const catchAnchor = "}).catch(function (error) {";
          const catchStart = onlineBlock.indexOf(catchAnchor);
          const catchEndAnchor = "\\n        });";
          const catchEnd = catchStart >= 0
              ? onlineBlock.indexOf(catchEndAnchor, catchStart)
              : -1;
          const catchBlock = catchStart >= 0 && catchEnd > catchStart
              ? onlineBlock.slice(catchStart, catchEnd)
              : "";

          ok(catchStart >= 0 && catchEnd > catchStart,
             "1. найден отдельный settlement-error catch");

          ok(catchBlock.includes("closeModal(endGameModal);"),
             "2. при settlement error end-game modal закрывается");

          ok(catchBlock.includes("leaveFinishedOnlineAndReturnToLobby();"),
             "3. при settlement error игрок локально возвращается в online-лобби");

          ok(!catchBlock.includes("cleanupFinishedRoom();"),
             "4. при settlement error finished outcome НЕ удаляется");

          ok(!catchBlock.includes("Telegram.WebApp.close()"),
             "5. при settlement error Telegram Mini App НЕ закрывается");

          console.log("\\nИТОГ: " + passed + "/5, провалено: " + failed);
          process.exit(failed ? 1 : 0);
          ''',
          'tests/finished-close-listener-order.test.js': '''const fs = require("fs");

          const src = fs.readFileSync("script.js", "utf8");
          let passed = 0;
          let failed = 0;

          function ok(cond, name) {
              if (cond) {
                  passed++;
                  console.log("✅ " + name);
              } else {
                  failed++;
                  console.log("❌ " + name);
              }
          }

          const marker = "// ===== НОВАЯ ИГРА / ЗАКРЫТЬ =====";
          const markerPos = src.indexOf(marker);
          const cleanupFnPos = src.indexOf("function cleanupFinishedRoom()", markerPos);
          const section = markerPos >= 0 && cleanupFnPos > markerPos ? src.slice(markerPos, cleanupFnPos) : "";

          const handlerStart = section.indexOf('btnCloseGame.addEventListener("click"');
          const onlineAnchor = "if (isOnlineGame && currentState && currentState.winner && roomCode) {";
          const onlineStart = section.indexOf(onlineAnchor, handlerStart);
          const fallbackAnchor = "\\n    closeModal(endGameModal);\\n    markMyselfLeftExplicitly();";
          const onlineEnd = section.indexOf(fallbackAnchor, onlineStart);
          const onlineBlock = onlineStart >= 0 && onlineEnd > onlineStart ? section.slice(onlineStart, onlineEnd) : "";

          const waitIdx = onlineBlock.indexOf("waitForSettlementBeforeRoomMutation()");
          const detachIdx = onlineBlock.indexOf("detachRoomListener();");
          const cleanupIdx = onlineBlock.indexOf("cleanupFinishedRoom();");

          ok(onlineStart >= 0 && onlineEnd > onlineStart, "1. найден finished-online путь «Закрыть»");
          ok(waitIdx >= 0 && cleanupIdx > waitIdx, "2. settlement-barrier остаётся перед cleanup");
          ok(detachIdx >= 0, "3. finished-online путь явно снимает старый room-listener");
          ok(detachIdx > waitIdx && detachIdx < cleanupIdx, "4. room-listener снимается ДО cleanupFinishedRoom()");
          ok(!onlineBlock.includes("Telegram.WebApp.close()"), "5. finished-online путь не закрывает Telegram Mini App");

          console.log("\\nИТОГ: " + passed + "/5, провалено: " + failed);
          process.exit(failed ? 1 : 0);
          ''',
          'tests/finished-close-presence-order.test.js': '''const fs = require("fs");

          const src = fs.readFileSync("script.js", "utf8");
          let passed = 0;
          let failed = 0;

          function ok(cond, name) {
              if (cond) {
                  passed++;
                  console.log("✅ " + name);
              } else {
                  failed++;
                  console.log("❌ " + name);
              }
          }

          const marker = "// ===== НОВАЯ ИГРА / ЗАКРЫТЬ =====";
          const markerPos = src.indexOf(marker);
          const cleanupPos = src.indexOf("function cleanupFinishedRoom()", markerPos);
          const section = markerPos >= 0 && cleanupPos > markerPos
              ? src.slice(markerPos, cleanupPos)
              : "";

          const onlineAnchor = "if (isOnlineGame && currentState && currentState.winner && roomCode) {";
          const onlineStart = section.indexOf(onlineAnchor);
          const fallbackAnchor = "\\n    closeModal(endGameModal);\\n    markMyselfLeftExplicitly();";
          const onlineEnd = section.indexOf(fallbackAnchor, onlineStart);

          const onlineBlock = onlineStart >= 0 && onlineEnd > onlineStart
              ? section.slice(onlineStart, onlineEnd)
              : "";

          const catchAnchor = "}).catch(function (error) {";
          const catchStart = onlineBlock.indexOf(catchAnchor);

          const thenBlock = catchStart >= 0
              ? onlineBlock.slice(0, catchStart)
              : "";

          const catchBlock = catchStart >= 0
              ? onlineBlock.slice(catchStart)
              : "";

          const thenDetach = thenBlock.indexOf("detachRoomListener();");
          const thenMark = thenBlock.indexOf("markMyselfLeftExplicitly();");

          const catchDetach = catchBlock.indexOf("detachRoomListener();");
          const catchMark = catchBlock.indexOf("markMyselfLeftExplicitly();");

          ok(thenDetach >= 0 && thenMark >= 0,
             "1. success/blocked путь содержит detach listener и explicit presence leave");

          ok(thenDetach < thenMark,
             "2. success/blocked: room-listener снимается ДО markMyselfLeftExplicitly()");

          ok(catchDetach >= 0 && catchMark >= 0,
             "3. settlement-error catch содержит detach listener и explicit presence leave");

          ok(catchDetach < catchMark,
             "4. settlement-error: room-listener снимается ДО markMyselfLeftExplicitly()");

          console.log("\\nИТОГ: " + passed + "/4, провалено: " + failed);
          process.exit(failed ? 1 : 0);
          '''
          }

          for path, content in tests.items():
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              lines = content.splitlines()
              min_indent = min((len(line) - len(line.lstrip()) for line in lines if line.strip()), default=0)
              normalized = '\n'.join(line[min_indent:] if line.strip() else '' for line in lines) + '\n'
              p.write_text(normalized, encoding='utf-8', newline='\n')
          PY

          node --check script.js
          node tests/finished-close-lobby.test.js
          node tests/finished-close-listener-order.test.js
          node tests/finished-close-settlement-error.test.js
          node tests/finished-close-presence-order.test.js

          node tests/rated-start-gate.test.js
          node tests/worker/rated-replay-unit.test.mjs
          node tests/back-button.test.js
          node tests/lobby-render.test.js
          node tests/room-cleanup.test.js
          node tests/room-spectators-listener.test.js
          node tests/presence-lifecycle.test.js
          node tests/settlement-behavior.test.js
          node tests/rematch-attribution.test.js

          test "$(sha256sum script.js | awk '{print toupper($1)}')" = "56F940DE6A735F7C6ADD33F77B88DFD6820972F0012857D266272CA50D518D11"
          test "$(sha256sum tests/finished-close-lobby.test.js | awk '{print toupper($1)}')" = "656EA71EF64A106D4DCFAC5FCDC6E6E449981B71EE19D70B51DF99F783DDBDC4"

      - name: Commit reviewed candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "close-lobby-publisher"
          git config user.email "close-lobby-publisher@local"
          git add script.js \
            tests/finished-close-lobby.test.js \
            tests/finished-close-listener-order.test.js \
            tests/finished-close-settlement-error.test.js \
            tests/finished-close-presence-order.test.js
          git rm .github/workflows/apply-finished-close-lobby.yml
          git diff --cached --check
          git commit -m "fix: return finished online game to lobby"
          git push origin HEAD:fix/finished-close-lobby
