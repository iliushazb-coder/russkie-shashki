name: n24-publish-exact

on:
  push:
    branches:
      - ci-n24-publish

permissions:
  contents: write

jobs:
  build-exact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble exact candidate
        shell: bash
        run: |
          set -euo pipefail
          cat .n24exact/part00.b64 .n24exact/part00b.b64 .n24exact/part01.b64 .n24exact/part02.b64 .n24exact/part03.b64 > /tmp/n24.patch.gz.b64
          base64 -d /tmp/n24.patch.gz.b64 > /tmp/n24.patch.gz
          gzip -dc /tmp/n24.patch.gz > /tmp/n24-final.patch
          echo "ed1cc39224abb2eaa180f0ad213346839d35d8578d72deef938302c0f592f883  /tmp/n24-final.patch" | sha256sum -c -
          git config user.name "candidate-review"
          git config user.email "candidate-review@local"
          git reset --hard 351295d40844869b60615fef9cc7ddad6fc52cc6
          git am /tmp/n24-final.patch
          test "$(git rev-parse HEAD^)" = "351295d40844869b60615fef9cc7ddad6fc52cc6"
          test "$(git rev-parse HEAD^{tree})" = "1a6e92a8e59d5c996b1db961a831e27db9dc8c5e"
          node --check script.js
          npm test
          git diff --check HEAD^ HEAD
      - name: Push transport candidate
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/publish/n24-final-transport --force
