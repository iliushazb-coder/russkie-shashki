name: n21 exact candidate CI
on:
  push:
    branches:
      - helper/n21-builder
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ef661a01ded2f866b295db66db735a873fcfbc7f
      - name: Verify exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'ef661a01ded2f866b295db66db735a873fcfbc7f'
          test "$(git rev-parse HEAD^)" = 'f276e972aceedb465a8b9fe56b9b31c3e34b81ae'
          test "$(git rev-parse HEAD^{tree})" = '7270d772a696139941ef6b1db1cb5accc079c387'
          git diff --check HEAD^..HEAD
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Frontend syntax
        run: npm run check
      - name: Frontend tests
        run: npm test
      - name: Install backend test dependencies
        run: npm ci
      - name: Worker syntax
        run: node --check worker/index.mjs
      - name: Worker unit tests
        run: node --test tests/worker/worker-unit.test.mjs
      - name: Settlement behavior tests
        run: node tests/settlement-behavior.test.js
      - name: Firebase Rules Emulator tests
        run: npm run test:rules
