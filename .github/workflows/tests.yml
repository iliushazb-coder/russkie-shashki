# Проверка каждого push и pull request.
#
# Этот workflow запускает dependency-free frontend suite. Backend/Emulator
# проверки живут отдельно в backend.yml; npm test по-прежнему запускает
# только голый Node без npm ci.
#
# Код возврата важнее вывода: сюита, упавшая при загрузке, печатает ноль
# проверок и молча уменьшает общий счёт. Раннер это ловит и завершается
# ненулевым кодом, а GitHub Actions падает по коду возврата шага.
name: tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Поставить Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Синтаксис script.js
        run: npm run check

      - name: Все тесты
        run: npm test
