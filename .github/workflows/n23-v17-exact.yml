name: n23-v17-exact

on:
  push:
    branches: [ci-n23-v17]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exact-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout CI carrier
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reconstruct exact v16 patch
        shell: bash
        run: |
          cat .ci/n23-v16/part00 .ci/n23-v16/part01 .ci/n23-v16/part02 .ci/n23-v16/part03 .ci/n23-v16/part04 \
              .ci/n23-v16/rem00 .ci/n23-v16/rem01 \
              .ci/n23-v16/b00 .ci/n23-v16/b01 .ci/n23-v16/b02 .ci/n23-v16/b03 \
              .ci/n23-v16/b04 .ci/n23-v16/b05 .ci/n23-v16/b06 .ci/n23-v16/b07 \
            | base64 -d | gzip -d > /tmp/n23-v16.patch
          cp .ci/n23-v17/v16-to-v17.patch /tmp/v16-to-v17.patch
          test "$(sha256sum /tmp/n23-v16.patch | awk '{print $1}')" = "6099a3da71504dcbaf9f133126320bfd45f013477759c7fc1074c147a336b49d"
          test "$(sha256sum /tmp/v16-to-v17.patch | awk '{print $1}')" = "2023da5568a19098bedbe538596eda88c3e6c4a444bebfbd96a1cec284576fa6"

      - name: Assemble exact v17
        shell: bash
        run: |
          BASE=7d48c75371bda0245ab63c012d578c78d592e4fd
          git reset --hard "$BASE"
          git clean -fdx
          git config user.name ci-review
          git config user.email ci-review@local
          git am /tmp/n23-v16.patch
          git apply --check /tmp/v16-to-v17.patch
          git apply /tmp/v16-to-v17.patch
          git add -A
          git diff --cached --check
          git reset --soft "$BASE"
          git commit -m "feat: authoritative rated replay and protected event log (#23)"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "PARENT=$(git rev-parse HEAD^)"
          echo "TREE=$(git rev-parse HEAD^{tree})"
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git rev-parse HEAD^{tree})" = "d7fe3118b93083e5fe3b2f5f0c23970c5906bede"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install
        run: npm ci

      - name: Firebase Rules Emulator tests
        run: npm run test:rules

      - name: Publish transport candidate branch
        shell: bash
        run: |
          BASE=7d48c75371bda0245ab63c012d578c78d592e4fd
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git rev-parse HEAD^{tree})" = "d7fe3118b93083e5fe3b2f5f0c23970c5906bede"
          git checkout "$BASE" -- .github/workflows/backend.yml
          git add .github/workflows/backend.yml
          git commit --amend --no-edit
          git push --force origin HEAD:refs/heads/publish/n23-v17-transport
