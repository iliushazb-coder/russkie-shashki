name: n37-publish-exact

on:
  push:
    branches:
      - ci-n37-publish
    paths:
      - .github/workflows/n37-publish-exact.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve exact patch
        run: cp .ci/n37.patch /tmp/n37.patch

      - name: Build exact candidate from frozen parent
        run: |
          git checkout --detach 6085e90ee0df12360dc6167e9a6bbe3d685b0fa7
          git apply --check /tmp/n37.patch
          git apply /tmp/n37.patch
          git diff --check
          test "$(git diff --name-only)" = "worker/index.mjs"
          test "$(sha256sum worker/index.mjs | awk '{print $1}')" = "89cccf5b1c8ff33fc195a222ac85430cb763be881fdcde599f3da6b9c1398f8b"
          git add worker/index.mjs
          test "$(git write-tree)" = "7939d2c35980298abb7fe16aa9e48d2e3aca21cc"

      - name: Setup Node 20 for frontend suite
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests workflow commands on exact candidate
        run: |
          npm run check
          npm test

      - name: Setup Node 22 for backend suite
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Run backend workflow commands on exact candidate
        run: |
          npm ci
          node --check worker/index.mjs
          node --test tests/worker/worker-unit.test.mjs tests/worker/rated-replay-unit.test.mjs
          node tests/settlement-behavior.test.js
          npm run test:rules

      - name: Verify published transport commit identity
        run: |
          git fetch origin publish/n37-final-transport
          test "$(git rev-parse origin/publish/n37-final-transport^{tree})" = "7939d2c35980298abb7fe16aa9e48d2e3aca21cc"
          test "$(git rev-parse origin/publish/n37-final-transport^)" = "6085e90ee0df12360dc6167e9a6bbe3d685b0fa7"
